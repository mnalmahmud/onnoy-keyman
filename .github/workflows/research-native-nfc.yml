name: Temporary Unicode input investigation
on:
  pull_request:
    paths: ['.github/workflows/research-native-nfc.yml']
  workflow_dispatch:
jobs:
  windows-native-edit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Win32 EDIT and RichEdit WM_CHAR insertion
        shell: pwsh
        run: |
          @'
          using System;
          using System.Runtime.InteropServices;
          using System.Text;
          public class WinInput {
            [DllImport("user32.dll", CharSet=CharSet.Unicode, SetLastError=true)]
            public static extern IntPtr CreateWindowExW(int exStyle, string cls, string title, int style, int x, int y, int w, int h, IntPtr parent, IntPtr menu, IntPtr instance, IntPtr param);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)]
            public static extern IntPtr SendMessageW(IntPtr h, uint msg, IntPtr wp, IntPtr lp);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)]
            public static extern int GetWindowTextW(IntPtr h, StringBuilder buf, int cap);
            [DllImport("kernel32.dll", CharSet=CharSet.Unicode)]
            public static extern IntPtr LoadLibraryW(string lib);
            public static void Run(string cls) {
              IntPtr hwnd = CreateWindowExW(0, cls, "", 0x10000000 | 0x0080 | 0x0004, 0, 0, 400, 100, IntPtr.Zero, IntPtr.Zero, IntPtr.Zero, IntPtr.Zero);
              if(hwnd == IntPtr.Zero) throw new Exception(cls + " creation failed " + Marshal.GetLastWin32Error());
              foreach(var pair in new[]{new[]{0x09C7,0x09BE},new[]{0x09C7,0x09D7},new[]{0x09AC,0x09BC}}) {
                // clear by selecting all and deleting
                SendMessageW(hwnd, 0x00B1, IntPtr.Zero, new IntPtr(-1)); 
                SendMessageW(hwnd, 0x0303, IntPtr.Zero, IntPtr.Zero);
                foreach(int codepoint in pair) SendMessageW(hwnd, 0x0102, new IntPtr(codepoint), IntPtr.Zero);
                var output = new StringBuilder(256);
                GetWindowTextW(hwnd, output, 256);
                string got=output.ToString();
                string codes=String.Join(" ", Array.ConvertAll(got.ToCharArray(), c=>((int)c).ToString("X4")));
                Console.WriteLine(cls + ": input " + String.Join(" ", Array.ConvertAll(pair,c=>c.ToString("X4"))) + " => " + codes);
              }
            }
          }
          '@ | Set-Content -Encoding utf8 test.cs
          Add-Type -TypeDefinition (Get-Content -Raw test.cs) -ErrorAction Stop
          [WinInput]::Run("EDIT")
          [void][WinInput]::LoadLibraryW("msftedit.dll")
          [WinInput]::Run("RICHEDIT50W")
  macos-nstext:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test NSTextView separate insertText calls
        shell: bash
        run: |
          cat > /tmp/test.swift <<'SWIFT'
          import AppKit
          let view = NSTextView(frame: NSRect(x:0,y:0,width:400,height:100))
          let pairs = [[0x09C7, 0x09BE], [0x09C7,0x09D7], [0x09AC,0x09BC]]
          for pair in pairs {
              view.string = ""
              view.setSelectedRange(NSRange(location:0,length:0))
              for scalar in pair {
                  let text=String(UnicodeScalar(scalar)!)
                  view.insertText(text, replacementRange:NSRange(location:NSNotFound,length:0))
              }
              let output=view.string.unicodeScalars.map { String(format:"%04X", $0.value) }.joined(separator:" ")
              let input=pair.map { String(format:"%04X", $0) }.joined(separator:" ")
              print("NSTextView: input \(input) => \(output)")
          }
          SWIFT
          swift /tmp/test.swift
