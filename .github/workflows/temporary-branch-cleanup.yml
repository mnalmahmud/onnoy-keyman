name: One-time branch cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-non-main-branches:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Delete all branches except main
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner, repo, per_page: 100,
            });
            for (const branch of branches) {
              if (branch.name === 'main') continue;
              if (branch.protected) {
                core.setFailed('Protected branch not deleted: ' + branch.name);
                continue;
              }
              await github.rest.git.deleteRef({
                owner, repo, ref: 'heads/' + branch.name,
              });
              core.info('Deleted ' + branch.name);
            }
