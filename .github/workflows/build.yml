name: Onnoy mapping, native and Keyman builds

on:
  push:
    branches: [main, feature/approved-unicode-layout-2026-11-01]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate, generate and run exact Unicode contract tests
        run: |
          python3 -m onnoy validate
          python3 -m onnoy generate
          python3 -m onnoy check
          python3 -m onnoy test
          python3 tools/benchmark.py --corpus tests/data/demo-bengali.txt > /tmp/onnoy-benchmark.json
          python3 -m json.tool /tmp/onnoy-benchmark.json > /dev/null
          node --check web/app.js
      - name: Compile Linux XKB symbols
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq x11-xkb-utils xkb-data
          printf 'xkb_keymap { xkb_keycodes { include "evdev+aliases(qwerty)" }; xkb_types { include "complete" }; xkb_compat { include "complete" }; xkb_symbols { include "pc+onnoy(basic)+inet(evdev)" }; xkb_geometry { include "pc(pc105)" }; };' > /tmp/onnoy-test.xkb
          xkbcomp -w 0 -I"$PWD/dist/linux" /tmp/onnoy-test.xkb /tmp/onnoy-test.xkm
      - name: Package native Linux source bundle
        run: bash tools/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: onnoy-linux-and-sources
          path: |
            build/onnoy-linux-native.tar.gz
            dist/linux/symbols/onnoy
            dist/windows/onnoy.klc
            dist/macos/Onnoy.keylayout
            dist/web/layout.json

  keyman-and-web:
    runs-on: ubuntu-latest
    needs: source-and-linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Keyman compiler
        run: npm install --no-audit --no-fund
      - name: Compile Keyman desktop and browser keyboard
        run: python3 -m onnoy package --target keyman
      - name: Check compiled keyboard outputs
        run: |
          test -s dist/keyman/onnoy.kmx
          test -s dist/keyman/onnoy.js
          test -s dist/keyman/onnoy.kmp
          test -s dist/keyman/onnoy.keyman-touch-layout
          node --check dist/keyman/onnoy.js
          python3 -m onnoy test --package-check
      - name: Assemble custom website and compiled Keyman keyboard
        run: |
          mkdir -p site
          cp web/index.html web/style.css web/app.js site/
          cp dist/web/layout.json site/layout.json
          cp dist/keyman/onnoy.js site/onnoy.js
          touch site/.nojekyll
      - name: Browser typing test using compiled Keyman and real KeymanWeb
        run: |
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium
          python3 -m onnoy test --browser
      - uses: actions/upload-artifact@v4
        with:
          name: onnoy-keyman-and-website
          path: |
            dist/keyman/onnoy.kmn
            dist/keyman/onnoy.kps
            dist/keyman/onnoy.keyman-touch-layout
            dist/keyman/onnoy.kmx
            dist/keyman/onnoy.js
            dist/keyman/onnoy.kmp
            site/
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  macos:
    runs-on: macos-latest
    needs: source-and-linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python3 -m onnoy generate
          python3 -m onnoy check
          python3 -m onnoy test
          bash tools/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: onnoy-native-macos-unsigned
          path: build/onnoy-macos.pkg

  windows:
    runs-on: windows-latest
    needs: source-and-linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: pwsh
        run: |
          python -m onnoy generate
          python -m onnoy check
          python -m onnoy test
          Write-Host "Generated KLC only; native DLL install not yet verified"
      - uses: actions/upload-artifact@v4
        with:
          name: onnoy-native-windows-klc-source
          path: dist/windows/onnoy.klc

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: keyman-and-web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: onnoy-github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
