name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  native:
    name: Native (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            shell: bash
            artifacts: |
              build/onnoy-linux-native.tar.gz
              dist/linux/symbols/onnoy
          - platform: macos
            os: macos-latest
            shell: bash
            artifacts: |
              build/onnoy-macos.pkg
              dist/macos/Onnoy.keylayout
          - platform: windows
            os: windows-latest
            shell: pwsh
            artifacts: dist/windows/onnoy.klc

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate, generate, test and check
        shell: ${{ matrix.shell }}
        run: |
          python -m onnoy validate
          python -m onnoy test
          python -m onnoy check

      - name: Compile and package Linux XKB
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq x11-xkb-utils xkb-data
          printf 'xkb_keymap { xkb_keycodes { include "evdev+aliases(qwerty)" }; xkb_types { include "complete" }; xkb_compat { include "complete" }; xkb_symbols { include "pc+onnoy(basic)+inet(evdev)" }; xkb_geometry { include "pc(pc105)" }; };' > /tmp/onnoy.xkb
          xkbcomp -w 0 -I"$PWD/dist/linux" /tmp/onnoy.xkb /tmp/onnoy.xkm
          python tools/benchmark.py > /tmp/onnoy-benchmark.json
          python -m json.tool /tmp/onnoy-benchmark.json > /dev/null
          python -m onnoy package --target linux

      - name: Package macOS layout
        if: runner.os == 'macOS'
        run: python -m onnoy package --target macos

      - uses: actions/upload-artifact@v4
        with:
          name: onnoy-${{ matrix.platform }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  keyman:
    name: Keyman and browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Keyman
        run: |
          npm install --no-audit --no-fund
          python -m onnoy package --target keyman
          node --check dist/keyman/onnoy.js
          node --check web/app.js

      - name: Assemble website
        run: |
          mkdir -p site
          cp web/index.html web/style.css web/app.js site/
          cp dist/web/layout.json site/layout.json
          cp dist/keyman/onnoy.js site/onnoy.js
          touch site/.nojekyll

      - name: Test compiled package and browser typing
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
          python -m onnoy test --package-check --browser

      - uses: actions/upload-artifact@v4
        with:
          name: onnoy-keyman-and-website
          path: |
            dist/keyman/onnoy.kmn
            dist/keyman/onnoy.kps
            dist/keyman/onnoy.keyman-touch-layout
            dist/keyman/onnoy.kmx
            dist/keyman/onnoy.js
            dist/keyman/onnoy.kmp
            site/
          if-no-files-found: error

      - uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [native, keyman]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
