name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Check Python and JavaScript syntax
        run: |
          python -m compileall -q tools tests
          node --check web/app.js
      - name: Install Kalamine
        run: python -m pip install 'kalamine==0.40'
      - name: Test generators and Unicode
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build native layouts using Kalamine
        run: |
          kalamine build layout.toml --qwerty-shortcuts
          python tools/export_web_layout.py
      - name: Build Keyman
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:keyman
          node --check keyman/onnoy.js
          test -s keyman/onnoy.kmx
          test -s keyman/onnoy.js
          test -s keyman/onnoy.kmp
          test -s dist/onnoy.klc
          test -s dist/onnoy.keylayout
          test -s dist/onnoy-visualizer.json
      - name: Assemble web demo
        run: |
          mkdir -p site
          cp web/index.html web/style.css web/app.js site/
          cp dist/onnoy-visualizer.json site/layout.json
          cp keyman/onnoy.js site/onnoy.js
          touch site/.nojekyll
          test -s site/index.html
          test -s site/layout.json
          test -s site/onnoy.js
      - name: Browser smoke test
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
          RUN_BROWSER_TESTS=1 python -m unittest discover -s tests -p 'test_browser.py' -v
      - uses: actions/upload-artifact@v4
        with:
          name: onnoy-native-keyman-web
          path: |
            dist/
            keyman/onnoy.kmn
            keyman/onnoy.kps
            keyman/onnoy.keyman-touch-layout
            keyman/onnoy.kmx
            keyman/onnoy.js
            keyman/onnoy.kmp
            site/
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: site
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
