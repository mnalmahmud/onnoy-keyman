name: Build, test and publish Onnoy

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile and test keyboard + website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Keyman Developer CLI
        run: npm install -g @keymanapp/kmc@18
      - name: Generate and syntax-check native layout sources
        run: |
          python3 scripts/generate.py
          python3 scripts/generate.py --check
          python3 -c "import xml.etree.ElementTree as E; E.parse('dist/macos/Onnoy.keylayout')"
          sudo apt-get update -qq
          sudo apt-get install -y -qq x11-xkb-utils xkb-data
          printf 'xkb_keymap { xkb_keycodes { include "evdev+aliases(qwerty)" }; xkb_types { include "complete" }; xkb_compat { include "complete" }; xkb_symbols { include "pc+onnoy(basic)+inet(evdev)" }; xkb_geometry { include "pc(pc105)" }; };' > /tmp/onnoy-test.xkb
          xkbcomp -w 0 -I"$PWD/dist/linux" /tmp/onnoy-test.xkb /tmp/onnoy-test.xkm
      - name: Verify mapping, compile Keyman and check package
        run: bash scripts/build.sh
      - name: Stage browser site
        run: |
          mkdir -p site
          cp web/index.html web/style.css web/app.js build/onnoy.js site/
          cp layout/onnoy.json site/layout.json
          touch site/.nojekyll
          node --check web/app.js
      - name: Browser smoke tests
        run: |
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium
          python3 -m unittest discover -s tests -p 'test_browser.py'
      - name: Upload downloadable keyboard artifacts
        uses: actions/upload-artifact@v4
        with:
          name: onnoy-keyman
          path: |
            build/onnoy.kmp
            build/onnoy.kmx
            build/onnoy.js
            dist/linux/symbols/onnoy
            dist/linux/Onnoy.XCompose
            dist/macos/Onnoy.keylayout
            dist/windows/onnoy.klc
          if-no-files-found: error
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  release:
    name: Attach tested compiled files to GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: onnoy-keyman
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/onnoy.kmp
            release-assets/onnoy.kmx
            release-assets/onnoy.js
            release-assets/Onnoy.XCompose
            release-assets/onnoy.klc
            release-assets/Onnoy.keylayout
            release-assets/onnoy
          generate_release_notes: true

  deploy:
    name: Deploy browser playground
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: onnoy-github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
