name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build native layouts using Kalamine
        run: |
          python -m pip install 'kalamine==0.40'
          kalamine build layout.toml --qwerty-shortcuts
      - name: Build Keyman
        run: |
          npm install --no-audit --no-fund
          npm run build:keyman
          node --check keyman/onnoy.js
          node --check web/app.js
      - name: Test source parity
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Assemble web demo
        run: |
          mkdir -p site
          cp web/index.html web/style.css web/app.js site/
          cp dist/onnoy.json site/onnoy.json
          cp keyman/onnoy.js site/onnoy.js
          touch site/.nojekyll
      - name: Browser smoke test
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
          RUN_BROWSER_TESTS=1 python -m unittest discover -s tests -p 'test_browser.py' -v
      - uses: actions/upload-artifact@v4
        with:
          name: onnoy-native-keyman-web
          path: |
            dist/
            keyman/onnoy.kmx
            keyman/onnoy.js
            keyman/onnoy.kmp
            site/
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: site
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
